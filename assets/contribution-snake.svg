  <rect width="1000" height="190" rx="20" fill="url(#space)"/>
  <rect x="12" y="12" width="976" height="166" rx="13" fill="none" stroke="#6586a0" stroke-opacity=".32"/>
  <text x="46" y="47" fill="#74e8db" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">CONTRIBUTION TRAIL / FIRST ORBIT LOADING</text>
  <rect x="44" y="68" width="912" height="90" fill="url(#dots)"/>
  <path d="M 60 145 H 234 V 123 H 432 V 101 H 630 V 123 H 828" fill="none" stroke="#6dedda" stroke-width="14" stroke-linecap="square" opacity=".5"/>
