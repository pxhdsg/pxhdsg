      <stop offset="0" stop-color="#101831"/>
      <stop offset="1" stop-color="#162640"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="15" height="15" rx="3" fill="#30435b"/>
