<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">The snow cat from PXHDSG's avatar</title>
  <desc id="desc">A cream-and-brown pixel cat with bright blue eyes, a russet scarf, and snow beneath its paws.</desc>

  <!-- A small piece of the avatar's sunset and snow. -->
  <rect x="124" y="12" width="12" height="12" fill="#ffd7aa"/>
  <rect x="120" y="16" width="20" height="4" fill="#ffe8c7" opacity=".55"/>
  <rect x="16" y="128" width="128" height="8" fill="#a8c7de"/>
  <rect x="8" y="136" width="144" height="8" fill="#e9f5fb"/>
  <rect x="24" y="128" width="24" height="4" fill="#ffffff"/>
  <rect x="112" y="128" width="24" height="4" fill="#ffffff"/>

  <!-- Tail, body, and the angular silhouette of the fluffy cheeks. -->
  <rect x="8" y="104" width="32" height="24" fill="#554750"/>
  <rect x="8" y="104" width="16" height="16" fill="#8a675b"/>
  <rect x="16" y="112" width="24" height="16" fill="#f2ddc7"/>
  <rect x="32" y="100" width="96" height="36" fill="#554750"/>
  <rect x="40" y="100" width="80" height="28" fill="#f6e8d6"/>
  <rect x="48" y="120" width="24" height="16" fill="#fff8ea"/>
  <rect x="88" y="120" width="24" height="16" fill="#fff8ea"/>
  <rect x="40" y="128" width="32" height="8" fill="#e8d2ba"/>
  <rect x="88" y="128" width="32" height="8" fill="#e8d2ba"/>

  <!-- Pointed ears and broad, soft head. -->
  <rect x="32" y="24" width="24" height="48" fill="#554750"/>
  <rect x="40" y="20" width="16" height="44" fill="#554750"/>
  <rect x="104" y="24" width="24" height="48" fill="#554750"/>
  <rect x="104" y="20" width="16" height="44" fill="#554750"/>
  <rect x="40" y="32" width="16" height="28" fill="#9d7568"/>
  <rect x="104" y="32" width="16" height="28" fill="#c59079"/>
  <rect x="44" y="39" width="8" height="17" fill="#e7b3a5"/>
  <rect x="108" y="39" width="8" height="17" fill="#e7b3a5"/>

  <rect x="24" y="52" width="112" height="60" fill="#554750"/>
  <rect x="32" y="44" width="96" height="76" fill="#554750"/>
  <rect x="20" y="80" width="120" height="32" fill="#554750"/>
  <rect x="28" y="56" width="104" height="56" fill="#f4e2cc"/>
  <rect x="36" y="48" width="88" height="64" fill="#f4e2cc"/>
  <rect x="28" y="88" width="104" height="24" fill="#fff5e8"/>
  <rect x="20" y="96" width="120" height="12" fill="#fff5e8"/>
  <rect x="36" y="56" width="36" height="28" fill="#927064"/>
  <rect x="32" y="76" width="24" height="20" fill="#927064"/>
  <rect x="40" y="48" width="20" height="12" fill="#6f5655"/>
  <rect x="60" y="48" width="52" height="12" fill="#fff7e8"/>
  <rect x="112" y="60" width="12" height="20" fill="#fdf0dc"/>
  <rect x="28" y="104" width="16" height="8" fill="#e8d3bd"/>
  <rect x="116" y="104" width="16" height="8" fill="#e8d3bd"/>

  <!-- Ice-blue eyes and a small pink nose. -->
  <rect x="53" y="73" width="17" height="22" fill="#4e5963"/>
  <rect x="91" y="73" width="17" height="22" fill="#4e5963"/>
  <rect x="57" y="75" width="11" height="18" fill="#39a4d9"/>
  <rect x="95" y="75" width="11" height="18" fill="#39a4d9"/>
  <rect x="60" y="78" width="5" height="13" fill="#164a79"/>
  <rect x="98" y="78" width="5" height="13" fill="#164a79"/>
  <rect x="58" y="76" width="4" height="5" fill="#d4f7ff"/>
  <rect x="96" y="76" width="4" height="5" fill="#d4f7ff"/>
  <rect x="76" y="94" width="8" height="6" fill="#d78b85"/>
  <rect x="73" y="101" width="4" height="3" fill="#805b60"/>
  <rect x="84" y="101" width="4" height="3" fill="#805b60"/>

  <!-- Russet scarf, the strongest color cue in the avatar. -->
  <rect x="44" y="108" width="72" height="16" fill="#6f3e3c"/>
  <rect x="52" y="108" width="60" height="12" fill="#a65b47"/>
  <rect x="64" y="120" width="40" height="8" fill="#8a463f"/>
  <rect x="72" y="128" width="28" height="8" fill="#a65b47"/>
  <rect x="80" y="136" width="12" height="6" fill="#7b403c"/>

  <rect x="12" y="42" width="4" height="4" fill="#a9dff0">
    <animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="144" y="70" width="4" height="4" fill="#ffd7aa">
    <animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/>
  </rect>
</svg>
