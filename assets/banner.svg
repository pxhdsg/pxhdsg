<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ideas in motion</title>
  <desc id="desc">A luminous research playground with a moving orbit and twinkling stars.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1025"/>
      <stop offset=".56" stop-color="#141839"/>
      <stop offset="1" stop-color="#10253b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62ead7"/>
      <stop offset=".52" stop-color="#bca1ff"/>
      <stop offset="1" stop-color="#ff8bc8"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7b66ef" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7b66ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#c2d8ff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#sky)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1015" cy="168" r="184" fill="url(#halo)"/>
  <rect x="19" y="19" width="1162" height="302" rx="15" fill="none" stroke="#8eb6d0" stroke-opacity=".24"/>
  <path d="M 43 290 H 1157" stroke="url(#accent)" stroke-opacity=".55"/>

  <g fill="#7cf6e8">
    <circle cx="97" cy="62" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="554" cy="71" r="1.8"><animate attributeName="opacity" values="1;.18;1" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="688" cy="266" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="1133" cy="51" r="2"><animate attributeName="opacity" values="1;.18;1" dur="4.8s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="88" fill="#77eadb" font-size="16" font-weight="700" letter-spacing="4">PXHDSG   /   OPEN LAB 001</text>
    <text x="75" y="172" fill="#f7f6ff" font-size="58" font-weight="800" letter-spacing="2">IDEAS IN MOTION</text>
    <path d="M 78 189 H 613" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="79" y="225" fill="#b6c7dc" font-size="18" letter-spacing=".8">an unfinished universe of agents, experiments &amp; strange possibilities</text>
    <text x="79" y="271" fill="#9bc2d8" font-size="13" font-weight="700" letter-spacing="2.4">GUI AGENTS   ✦   MULTIMODAL AI   ✦   RSI</text>
  </g>

  <g transform="translate(1016 170)">
    <circle r="109" fill="none" stroke="#98a9fc" stroke-opacity=".25" stroke-width="2"/>
    <circle r="78" fill="none" stroke="#6be8dc" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 8"/>
    <circle r="46" fill="#171e45" stroke="#bba5ff" stroke-width="2"/>
    <circle r="28" fill="#273865"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <circle cx="0" cy="-109" r="8" fill="#ff97cb" filter="url(#soft-glow)" opacity=".8"/>
      <circle cx="0" cy="-109" r="5" fill="#ff97cb"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      <rect x="73" y="-5" width="10" height="10" rx="2" fill="#71f7e4" transform="rotate(45 78 0)"/>
    </g>
    <circle cx="-88" cy="19" r="4" fill="#a8a3ff"/>
    <circle cx="67" cy="72" r="3" fill="#ffc0e1"/>
  </g>
</svg>
